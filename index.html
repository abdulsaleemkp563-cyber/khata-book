<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHATA ULTIMATE PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body.dark-mode { background: #0b0f1a; color: #f8fafc; }
        body.light-mode { background: #f1f5f9; color: #0f172a; }

        #accessDenied, #lockScreen { position: fixed; inset: 0; background: #0b0f1a; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .app { max-width: 500px; margin: 0 auto; min-height: 100vh; display: none; flex-direction: column; }
        
        /* Pin Style */
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #3b82f6; margin: 0 12px; }
        .pin-dot.filled { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
        .key { width: 75px; height: 75px; border-radius: 50%; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }

        /* Dashboard & Cards */
        .dashboard-card { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); padding: 40px 25px; border-radius: 0 0 45px 45px; text-align: center; color: white; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3); position: relative; }
        .cust-card { display: flex; align-items: center; padding: 18px; border-radius: 22px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .dark-mode .cust-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.05); }
        .light-mode .cust-card { background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* Buttons & Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: flex-end; z-index: 1000; backdrop-filter: blur(8px); }
        .modal { width: 100%; max-width: 500px; padding: 35px; border-radius: 45px 45px 0 0; background: #1e293b; color: white; transform: translateY(100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); max-height: 90vh; overflow-y: auto; }
        .light-mode .modal { background: white; color: black; }
        .modal.active { transform: translateY(0); }
        .input-field { width: 100%; padding: 18px; border-radius: 18px; border: 1px solid rgba(128,128,128,0.2); background: rgba(128,128,128,0.05); color: inherit; outline: none; margin-bottom: 18px; font-size: 16px; }

        /* Print Style Enhancement */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .app { display: block !important; max-width: 100% !important; padding: 20px; }
            .print-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 10px; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            .print-table th, .print-table td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 14px; }
            .print-table th { background-color: #f2f2f2; font-weight: bold; }
            .print-balance { font-size: 20px; font-weight: 800; margin-top: 20px; text-align: right; }
        }
    </style>
</head>
<body class="dark-mode">

    <div id="accessDenied"><i class="fa-solid fa-user-lock text-7xl text-red-500 mb-8"></i><h1 class="text-3xl font-black">Access Denied</h1><p class="opacity-60 px-12 mt-4 text-lg">അഡ്മിൻ നൽകുന്ന സ്പെഷ്യൽ ലിങ്ക് ഉണ്ടെങ്കിൽ മാത്രമേ ഇത് ഉപയോഗിക്കാൻ കഴിയൂ.</p></div>
    <div id="lockScreen"><div class="mb-10"><h2 class="text-2xl font-black uppercase tracking-widest text-blue-500">Secure Vault</h2></div><div class="flex mb-12"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div><div class="grid grid-cols-3 gap-6"><div class="key" onclick="pressKey('1')">1</div><div class="key" onclick="pressKey('2')">2</div><div class="key" onclick="pressKey('3')">3</div><div class="key" onclick="pressKey('4')">4</div><div class="key" onclick="pressKey('5')">5</div><div class="key" onclick="pressKey('6')">6</div><div class="key" onclick="pressKey('7')">7</div><div class="key" onclick="pressKey('8')">8</div><div class="key" onclick="pressKey('9')">9</div><div class="key border-none opacity-40" onclick="clearPin()">C</div><div class="key" onclick="pressKey('0')">0</div><div class="key border-none opacity-40" onclick="exportJSON()"><i class="fa-solid fa-cloud-arrow-down text-xl"></i></div></div></div>

    <div class="app" id="mainApp">
        <div class="p-6 flex justify-between items-center no-print">
            <div class="flex items-center gap-4"><button id="backBtn" onclick="goHome()" class="hidden text-2xl"><i class="fa-solid fa-arrow-left-long"></i></button><h1 id="pageTitle" class="text-2xl font-black tracking-tight">MY KHATA</h1></div>
            <div class="flex gap-6 items-center"><button onclick="toggleTheme()" class="w-10 h-10 flex items-center justify-center bg-gray-500/10 rounded-full"><i id="themeIcon" class="fa-solid fa-moon"></i></button><button onclick="openAdmin()" class="w-10 h-10 flex items-center justify-center bg-blue-500/10 rounded-full"><i class="fa-solid fa-gear text-blue-500"></i></button><button onclick="location.reload()" class="w-10 h-10 flex items-center justify-center bg-red-500/10 rounded-full"><i class="fa-solid fa-power-off text-red-500"></i></button></div>
        </div>
        <div id="mainContent" class="flex-1 overflow-y-auto"></div>
        <div id="footerActions" class="no-print p-6"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"><div class="modal" id="modalBox" onclick="event.stopPropagation()"></div></div>

    <script>
        const STORAGE_ID = 'KHATA_ULTIMATE_FINAL_V2';
        let db = JSON.parse(localStorage.getItem(STORAGE_ID)) || { customers: [], trans: [], darkMode: true, pin: null, shopName: "KERALA STORE", links: [] };
        let activeCid = null, currentPinInput = "";

        function checkAccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');
            if (!userId) { document.getElementById('accessDenied').style.display = 'flex'; return; }
            document.getElementById('lockScreen').style.display = 'flex';
            applyTheme();
        }

        function pressKey(num) { if (currentPinInput.length < 4) { currentPinInput += num; updateDots(); if (currentPinInput.length === 4) setTimeout(validatePin, 250); } }
        function updateDots() { document.querySelectorAll('.pin-dot').forEach((d, i) => d.classList.toggle('filled', i < currentPinInput.length)); }
        function clearPin() { currentPinInput = ""; updateDots(); }
        function validatePin() { if (!db.pin) { db.pin = currentPinInput; saveDB(); unlock(); } else if (currentPinInput === db.pin) unlock(); else { alert("Wrong PIN!"); clearPin(); } }
        function unlock() { document.getElementById('lockScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'flex'; render(); }

        function applyTheme() { document.body.className = db.darkMode ? 'dark-mode' : 'light-mode'; document.getElementById('themeIcon').className = db.darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'; }
        function toggleTheme() { db.darkMode = !db.darkMode; applyTheme(); saveDB(); }
        function saveDB() { localStorage.setItem(STORAGE_ID, JSON.stringify(db)); render(); }
        function render() { activeCid ? renderDetails() : renderHome(); }

        function renderHome() {
            activeCid = null; document.getElementById('backBtn').classList.add('hidden'); document.getElementById('pageTitle').innerText = db.shopName;
            let gave = 0, got = 0; db.trans.forEach(t => { if(t.type === 'GAVE') gave += t.amt; else got += t.amt; });
            document.getElementById('mainContent').innerHTML = `
                <div class="dashboard-card"><p class="text-[11px] opacity-70 font-bold uppercase tracking-widest">Global Balance</p><h2 class="text-6xl font-black my-5">₹${(gave - got).toLocaleString()}</h2><div class="flex justify-between bg-black/20 p-5 rounded-3xl mt-6"><div><p class="text-[10px] opacity-60 font-bold">TOTAL GAVE</p><p class="text-xl font-black text-red-300">₹${gave}</p></div><div class="w-[1px] bg-white/10"></div><div><p class="text-[10px] opacity-60 font-bold">TOTAL GOT</p><p class="text-xl font-black text-green-300">₹${got}</p></div></div></div>
                <div class="px-6 mb-6 no-print"><input type="text" class="input-field mb-0 border-none bg-gray-500/10 focus:ring-2 ring-blue-500" placeholder="🔍 Search Customer..." oninput="renderCustList(this.value)"></div>
                <div id="custList" class="px-6 pb-32"></div>`;
            document.getElementById('footerActions').innerHTML = `<button class="w-full bg-blue-600 py-5 rounded-3xl font-black text-white text-lg shadow-xl shadow-blue-500/20" onclick="openCustModal()"><i class="fa-solid fa-user-plus mr-3"></i> ADD NEW CUSTOMER</button>`;
            renderCustList();
        }

        function renderCustList(q = "") {
            let filtered = db.customers.filter(c => c.name.toLowerCase().includes(q.toLowerCase()));
            document.getElementById('custList').innerHTML = filtered.map(c => {
                let bal = 0; db.trans.filter(t => t.cid === c.id).forEach(t => bal += (t.type === 'GAVE' ? t.amt : -t.amt));
                return `<div class="cust-card" onclick="viewCust(${c.id})"><div class="h-14 w-14 bg-blue-600 rounded-2xl flex items-center justify-center font-black text-white mr-5 text-xl shadow-lg shadow-blue-500/30">${c.name[0]}</div><div class="flex-1 font-bold text-lg">${c.name}</div><div class="text-right font-black text-xl ${bal >= 0 ? 'text-red-500' : 'text-green-500'}">₹${Math.abs(bal)}</div></div>`;
            }).join('') || '<p class="text-center opacity-20 py-20 font-bold">No Records Found</p>';
        }

        function viewCust(id) { activeCid = id; render(); }
        function goHome() { activeCid = null; render(); }

        function renderDetails() {
            const cust = db.customers.find(c => c.id === activeCid);
            document.getElementById('backBtn').classList.remove('hidden'); document.getElementById('pageTitle').innerText = cust.name;
            let raw = db.trans.filter(t => t.cid === activeCid), bal = 0; raw.forEach(t => bal += (t.type === 'GAVE' ? t.amt : -t.amt));
            document.getElementById('mainContent').innerHTML = `
                <div class="print-header app"><h1>${db.shopName}</h1><h3>Customer: ${cust.name}</h3><p>Balance: ₹${Math.abs(bal)} (${bal>=0?'Payable':'Receivable'})</p></div>
                <div class="dashboard-card no-print"><h2 class="text-5xl font-black">₹${Math.abs(bal)}</h2><p class="text-[11px] mt-3 opacity-70 font-bold uppercase">${bal >= 0 ? 'You will give' : 'You will get'}</p><div class="flex justify-center gap-4 mt-8"><button class="bg-white/10 px-8 py-3 rounded-2xl text-[12px] font-black uppercase border border-white/10" onclick="openCustModal(${cust.id})">Edit Profile</button><button class="bg-white text-blue-700 px-8 py-3 rounded-2xl text-[12px] font-black uppercase shadow-lg" onclick="window.print()">Print PDF</button></div></div>
                <div class="px-4 pb-40"><table class="print-table w-full text-left text-[13px]"><thead class="opacity-30 uppercase font-black border-b border-white/10"><tr><th class="py-4 px-2">Date/Note</th><th class="text-center">Gave</th><th class="text-center">Got</th><th class="text-right">Bal</th></tr></thead>
                <tbody>${raw.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(t => `<tr class="border-b border-gray-500/5"><td class="py-5 px-2"><b>${t.date}</b><br><span class="opacity-50 text-[11px] font-medium">${t.remark || '-'}</span></td><td class="text-center text-red-500 font-black text-base">${t.type==='GAVE'?'₹'+t.amt:'-'}</td><td class="text-center text-green-500 font-black text-base">${t.type==='GOT'?'₹'+t.amt:'-'}</td><td class="text-right font-black opacity-80 text-base" onclick="openTransModal('${t.type}', ${t.id})">₹${t.amt}</td></tr>`).join('')}</tbody></table></div>`;
            document.getElementById('footerActions').innerHTML = `<div class="fixed bottom-8 w-full max-w-[500px] left-1/2 -translate-x-1/2 px-6 flex gap-4"><button class="flex-1 bg-red-500 py-5 rounded-3xl font-black text-white text-lg shadow-xl shadow-red-500/30" onclick="openTransModal('GAVE')">GAVE ₹</button><button class="flex-1 bg-green-600 py-5 rounded-3xl font-black text-white text-lg shadow-xl shadow-green-600/30" onclick="openTransModal('GOT')">GOT ₹</button></div>`;
        }

        function openAdmin() {
            let linksHtml = (db.links || []).map(l => `<div class="flex justify-between items-center p-4 bg-blue-500/5 rounded-2xl mb-3"><span class="font-bold text-sm uppercase">${l.name}</span><button onclick="copyLink('${l.url}')" class="text-blue-500 font-black text-xs bg-blue-500/10 px-4 py-2 rounded-xl">COPY LINK</button></div>`).join('');
            openModal(`<h3 class="text-xl font-black mb-8 uppercase tracking-widest">Admin Settings</h3><label class="text-[10px] font-bold opacity-40 ml-2">BUSINESS NAME</label><input type="text" id="sName" class="input-field" value="${db.shopName}"><button class="w-full bg-blue-600 py-4 rounded-2xl font-black mb-10 shadow-lg" onclick="db.shopName=document.getElementById('sName').value; saveDB(); closeModal();">SAVE BUSINESS NAME</button><div class="mb-6"><p class="text-[11px] font-bold opacity-40 mb-3 uppercase">Manage Access Links</p><div class="flex gap-3"><input type="text" id="newUid" class="input-field mb-0 border-none bg-gray-500/10" placeholder="Staff/User Name"><button class="bg-blue-600 px-6 rounded-2xl font-black text-white" onclick="generateLink()">GET</button></div></div><div class="max-h-48 overflow-y-auto mb-8">${linksHtml || '<p class="text-center opacity-30 text-xs">No Access Links Created</p>'}</div><div class="grid grid-cols-2 gap-4"><button class="bg-emerald-600 py-4 rounded-2xl font-black text-xs text-white uppercase" onclick="exportJSON()">Backup Data</button><button class="bg-red-600 py-4 rounded-2xl font-black text-xs text-white uppercase" onclick="if(confirm('Reset PIN?')) {db.pin=null;saveDB();location.reload();}">Reset PIN</button></div>`);
        }

        function generateLink() { let n = document.getElementById('newUid').value.trim().toLowerCase(); if(!n) return; let url = window.location.href.split('?')[0] + '?id=' + n; if(!db.links) db.links = []; db.links.push({ name: n, url }); saveDB(); openAdmin(); }
        function copyLink(url) { navigator.clipboard.writeText(url).then(() => alert("ലിങ്ക് കോപ്പി ചെയ്തു!")); }
        function openModal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modalOverlay').style.display = 'flex'; setTimeout(()=>document.getElementById('modalBox').classList.add('active'), 10); }
        function closeModal() { document.getElementById('modalBox').classList.remove('active'); setTimeout(()=>document.getElementById('modalOverlay').style.display='none', 300); }
        
        function openCustModal(id=null) {
            const c = id ? db.customers.find(x=>x.id===id) : {name:'', phone:''};
            openModal(`<h3 class="text-xl font-black mb-8 uppercase">Customer Profile</h3><input type="text" id="cName" class="input-field" placeholder="Full Name" value="${c.name}"><input type="number" id="cPhone" class="input-field" placeholder="WhatsApp Number" value="${c.phone}"><button class="w-full bg-blue-600 py-5 rounded-3xl font-black text-white text-lg" onclick="saveCust(${id})">SAVE CUSTOMER</button>${id ? `<button class="w-full mt-6 text-red-500 font-bold text-sm uppercase tracking-widest" onclick="deleteCust(${id})">Delete Account</button>` : ''}`);
        }
        function saveCust(id) { let n = document.getElementById('cName').value; if(!n) return; if(id) { let x=db.customers.find(y=>y.id===id); x.name=n; x.phone=document.getElementById('cPhone').value; } else { db.customers.push({id:Date.now(), name:n, phone:document.getElementById('cPhone').value}); } saveDB(); closeModal(); }
        function deleteCust(id) { if(confirm("Account ഒഴിവാക്കണോ?")) { db.customers=db.customers.filter(x=>x.id!==id); db.trans=db.trans.filter(x=>x.cid!==id); saveDB(); closeModal(); goHome(); } }

        function openTransModal(type, editId=null) {
            const t = editId ? db.trans.find(x=>x.id===editId) : {amt:'', remark:'', date:new Date().toISOString().split('T')[0]};
            openModal(`<h3 class="text-xl font-black mb-8 uppercase text-center">${type} ENTRY</h3><label class="text-[10px] font-bold opacity-40 ml-2">AMOUNT (₹)</label><input type="number" id="tAmt" class="input-field text-4xl font-black text-center text-blue-500" value="${t.amt}" placeholder="0"><input type="text" id="tRem" class="input-field" value="${t.remark}" placeholder="Notes/Remarks"><input type="date" id="tDate" class="input-field font-bold" value="${t.date}"><button class="w-full bg-blue-600 py-5 rounded-3xl font-black text-white text-lg" onclick="saveTrans('${type}', ${editId})">CONFIRM & SAVE</button>${editId ? `<button class="w-full mt-6 text-red-500 font-bold text-sm uppercase" onclick="deleteTrans(${editId})">Delete Transaction</button>` : ''}`);
        }
        function saveTrans(type, id) {
            let a = parseFloat(document.getElementById('tAmt').value); if(!a) return;
            if(id) { let x=db.trans.find(y=>y.id===id); x.amt=a; x.date=document.getElementById('tDate').value; x.remark=document.getElementById('tRem').value; }
            else { db.trans.push({id:Date.now(), cid:activeCid, type, amt:a, date:document.getElementById('tDate').value, remark:document.getElementById('tRem').value}); }
            saveDB(); closeModal();
            
            const cust = db.customers.find(c => c.id === activeCid);
            if(cust.phone && confirm("WhatsApp message അയക്കണോ?")) {
                let bal = 0; db.trans.filter(t => t.cid === activeCid).forEach(t => bal += (t.type === 'GAVE' ? t.amt : -t.amt));
                const msg = `🧾 *${db.shopName} - NEW ENTRY*%0A---------------------------%0A*Customer:* ${cust.name}%0A*Amount:* ₹${a}%0A*Type:* ${type}%0A*Current Balance:* ₹${Math.abs(bal)}%0A---------------------------%0A_Thank you for your business!_`;
                window.open(`https://wa.me/91${cust.phone}?text=${msg}`, '_blank');
            }
        }
        function deleteTrans(id) { if(confirm("Delete?")) { db.trans=db.trans.filter(x=>x.id!==id); saveDB(); closeModal(); } }
        function exportJSON() { const b = new Blob([JSON.stringify(db)], {type:'application/json'}); const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download='Khata_Backup.json'; a.click(); }

        window.onload = checkAccess;
    </script>
</body>
</html>
